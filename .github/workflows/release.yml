name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # lets the packager attach the zip to a GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the changelog is built from commits since the last tag
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
